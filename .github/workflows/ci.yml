name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install tools for the network tool tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends traceroute
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes backend/app backend/tests scripts
      - name: Tests
        working-directory: backend
        run: python -m pytest -q tests
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose -f compose.yml config -q
          PROXY_NETWORK=proxy docker compose -f portainer-stack.yml config -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Every change (including Dependabot base image bumps) is built and started before anything is published.
      - name: Build image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: emberwatch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (same hardening as the compose files)
        run: |
          docker volume create ew-ci
          docker run -d --name ew -p 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp --security-opt no-new-privileges:true --cap-drop ALL \
            --sysctl net.ipv4.ping_group_range="0 2147483647" \
            -v ew-ci:/data -e AUTH_MODE=password -e AUTH_PASSWORD=ci-smoke-test-password \
            emberwatch:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then docker logs ew; exit 1; fi
          echo
          docker exec ew python --version
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Site: same-origin' http://127.0.0.1:8000/api/overview)" = 401
          docker exec ew /usr/local/bin/ping -c 1 -W 2 127.0.0.1 > /dev/null
          docker logs ew 2>&1 | tail -n 40
          docker rm -f ew
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/saturdaynetlab/emberwatch
          # Release tag v3.1.2 -> 3.1.2, 3.1, 3 and latest (latest only for releases).
          # Every push to main -> edge. Every build -> sha-<short>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,format=short
      - name: Build and push (amd64, arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
